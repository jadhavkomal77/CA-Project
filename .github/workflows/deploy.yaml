name: Production Deploy

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install Client Dependencies
        run: npm ci
        working-directory: client

      - name: Build Client
        run: npm run build
        working-directory: client

      - name: Install Server Dependencies
        run: npm ci
        working-directory: server

      - name: Build Server
        run: |
          if npm run | grep -q " build"; then
            npm run build
          else
            echo "No server build script found. Skipping server build."
          fi
        working-directory: server

      # Deploy hook URLs are configured directly below.
      # If a URL is ever removed, the step is skipped and the build still succeeds.
      - name: Trigger Vercel Client Deploy Hook
        env:
          DEPLOY_HOOK_URL: https://api.vercel.com/v1/integrations/deploy/prj_xqgjFKppQK7odjv7zbNXJcPVsC9j/1tHbQcwowZ
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::warning::Client deploy hook URL is empty; skipping client deploy hook."
            exit 0
          fi
          echo "Triggering Vercel Client Deploy Hook..."
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST \
            "$DEPLOY_HOOK_URL"
          echo "Client deploy hook triggered successfully."

      - name: Trigger Vercel Server Deploy Hook
        env:
          DEPLOY_HOOK_URL: https://api.vercel.com/v1/integrations/deploy/prj_Fj2aE2M6txBnC2gnsFQMBnGSnykC/dcZ8ZLVzj2
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::warning::Server deploy hook URL is empty; skipping server deploy hook."
            exit 0
          fi
          echo "Triggering Vercel Server Deploy Hook..."
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST \
            "$DEPLOY_HOOK_URL"
          echo "Server deploy hook triggered successfully."
