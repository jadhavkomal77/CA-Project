name: Production Deploy

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install Client Dependencies
        run: npm ci
        working-directory: client

      - name: Build Client
        run: npm run build
        working-directory: client

      - name: Install Server Dependencies
        run: npm ci
        working-directory: server

      - name: Build Server
        run: |
          if npm run | grep -q " build"; then
            npm run build
          else
            echo "No server build script found. Skipping server build."
          fi
        working-directory: server

      # Optional: set VERCEL_*_DEPLOY_HOOK_URL in repo Settings → Secrets → Actions.
      # If unset, the step is skipped (build still succeeds). Hooks 404 when URL is stale.
      - name: Trigger Vercel Client Deploy Hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_CLIENT_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::warning::VERCEL_CLIENT_DEPLOY_HOOK_URL is not set; skipping client deploy hook. Add the secret to trigger Vercel after each push."
            exit 0
          fi
          echo "Triggering Vercel Client Deploy Hook..."
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST \
            "$DEPLOY_HOOK_URL"
          echo "Client deploy hook triggered successfully."

      - name: Trigger Vercel Server Deploy Hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_SERVER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::warning::VERCEL_SERVER_DEPLOY_HOOK_URL is not set; skipping server deploy hook. Add the secret to trigger Vercel after each push."
            exit 0
          fi
          echo "Triggering Vercel Server Deploy Hook..."
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST \
            "$DEPLOY_HOOK_URL"
          echo "Server deploy hook triggered successfully."
