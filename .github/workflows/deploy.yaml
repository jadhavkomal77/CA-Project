name: Production Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install Client Dependencies
        run: npm ci
        working-directory: client

      - name: Build Client
        run: npm run build
        working-directory: client

      - name: Install Server Dependencies
        run: npm ci
        working-directory: server

      - name: Build Server
        run: |
          if npm run | grep -q " build"; then
            npm run build
          else
            echo "No server build script found. Skipping server build."
          fi
        working-directory: server

      # Deploy hook URLs return 404 if the hook was deleted or regenerated in Vercel.
      # Set full hook URLs in GitHub: Settings → Secrets and variables → Actions.
      - name: Trigger Vercel Client Deploy Hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_CLIENT_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing repository secret VERCEL_CLIENT_DEPLOY_HOOK_URL. In Vercel: Project → Settings → Git → Deploy Hooks → copy URL; add secret in GitHub."
            exit 1
          fi
          echo "Triggering Vercel Client Deploy Hook..."
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST \
            "$DEPLOY_HOOK_URL"
          echo "Client deploy hook triggered successfully."

      - name: Trigger Vercel Server Deploy Hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_SERVER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing repository secret VERCEL_SERVER_DEPLOY_HOOK_URL. In Vercel: Project → Settings → Git → Deploy Hooks → copy URL; add secret in GitHub."
            exit 1
          fi
          echo "Triggering Vercel Server Deploy Hook..."
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST \
            "$DEPLOY_HOOK_URL"
          echo "Server deploy hook triggered successfully."
